<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Satellite view – border crossing</title>
<style>
:root{--bg:#f7f6f2;--fg:#1f2430;--mut:#5d6270;--card:#ffffff;--bd:#d9d6cc;--ac:#e8590c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181c;--fg:#ececea;--mut:#a3a6b0;--card:#22242a;--bd:#3a3d46;--ac:#ff8a4c}}
:root[data-theme="dark"]{--bg:#17181c;--fg:#ececea;--mut:#a3a6b0;--card:#22242a;--bd:#3a3d46;--ac:#ff8a4c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 2px;font-weight:600}
.sub,.note{margin:0 0 12px;color:var(--mut);font-size:14px}
#map{position:relative;width:100%;aspect-ratio:3/4;max-height:78vh;background:#0b2239;border:1px solid var(--bd);border-radius:14px;overflow:hidden}
#cv{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
#banner{position:absolute;top:10px;left:10px;right:10px;text-align:center;font-weight:700;font-size:14px;padding:8px 10px;border-radius:10px;background:#1e9e45;color:#fff;pointer-events:none}
#banner.warn{background:#d98a00}
#banner.cross{background:#d92b2b;animation:bl .5s infinite alternate}
@keyframes bl{to{opacity:.55}}
@media (prefers-reduced-motion:reduce){#banner.cross{animation:none}}
#flash{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 70px 18px rgba(255,0,0,.9);opacity:0}
#start{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:17px;padding:12px 22px;background:var(--ac);border-color:var(--ac);color:#fff}
button{font:inherit;font-size:14px;padding:8px 14px;border-radius:999px;border:1px solid var(--bd);background:var(--card);color:var(--fg);cursor:pointer}
button[aria-pressed="true"]{background:var(--ac);border-color:var(--ac);color:#fff}
#read{margin:10px 0 0;font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
</style>
</head>
<body>
<main>
<h1>Satellite view</h1>
<p class="sub">Each dot is one GPS fix. Green is safe, amber is the warning zone, red is across the border.</p>
<div id="map">
<canvas id="cv"></canvas>
<div id="banner">SAFE · Home waters</div>
<div id="flash"></div>
<button id="start">▶ Start</button>
</div>
<p id="read">Distance to border: 2.2 km</p>
<div class="row">
<button id="bTurn">Return to port</button>
<button id="bFollow" aria-pressed="false">Follow boat</button>
<button id="bFit">Fit view</button>
<button id="bRe">Restart</button>
<button id="bSnd" aria-pressed="true">Sound on</button>
</div>
<p class="note">Drag to slide the map, pinch or scroll to zoom, tap to steer the boat there. The alarm beeps only after the boat crosses the red border line.</p>
</main>
<script>
(function(){
var wrap=document.getElementById('map'),cv=document.getElementById('cv'),cx=cv.getContext('2d');
var $=function(id){return document.getElementById(id);};
var WX=3,WY=4,X0=-1.5,Y0=-0.5,BY=2.2,ZW=0.8,SPEED=0.11;
var COL=['#2ee66b','#ffb020','#ff3b30'],TXT=['SAFE · Home waters','WARNING ZONE · Border ahead','BORDER CROSSED · ALARM'],CLS=['','warn','cross'];
var W=1,H=1,S=1,S0=1,dpr=1,vx=0,vy=1.5,zm=1,follow=false;
var b,tgt,dots,last,marks,status,pulse,nextB,nb,started=false,ac=null,snd=true,lastU=0,prev=0;
function reset(){
b={x:0,y:0,h:0.12};tgt={x:0.3,y:3.3};dots=[];last=null;marks=[];status=0;pulse=0;nextB=0;nb=0;
}
reset();
function fit(){
dpr=Math.min(window.devicePixelRatio||1,2);W=wrap.clientWidth;H=wrap.clientHeight;
cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
S0=Math.min(W/WX,H/WY);S=S0*zm;
}
if(window.ResizeObserver)new ResizeObserver(fit).observe(wrap);
window.addEventListener('resize',fit);fit();
function sx(x){return W/2+(x-vx)*S;}
function sy(y){return H/2-(y-vy)*S;}
function beep(f,d){
if(!ac||!snd)return;
var o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;
o.type='square';o.frequency.value=f;g.gain.setValueAtTime(0.07,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);
o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d);
}
$('start').onclick=function(){
try{ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();}catch(e){ac=null;}
started=true;this.style.display='none';
};
$('bTurn').onclick=function(){tgt={x:0,y:0};};
$('bRe').onclick=reset;
var bSnd=$('bSnd');
bSnd.onclick=function(){snd=!snd;bSnd.setAttribute('aria-pressed',snd?'true':'false');bSnd.textContent=snd?'Sound on':'Sound off';};
var bFollow=$('bFollow'),ptr=new Map(),moved=0,lastD=1;
function setFollow(v){follow=v;bFollow.setAttribute('aria-pressed',v?'true':'false');}
bFollow.onclick=function(){setFollow(!follow);};
$('bFit').onclick=function(){setFollow(false);zm=1;S=S0;vx=0;vy=1.5;};
function wxp(px){return vx+(px-W/2)/S;}
function wyp(py){return vy-(py-H/2)/S;}
function zoomAt(px,py,f){
var nz=Math.max(0.3,Math.min(14,zm*f)),ax=wxp(px),ay=wyp(py);
zm=nz;S=S0*zm;vx=ax-(px-W/2)/S;vy=ay+(py-H/2)/S;
}
function ppos(e){var r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];}
function dist2(){var a=Array.from(ptr.values());return Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])||1;}
cv.addEventListener('pointerdown',function(e){
cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,ppos(e));moved=0;cv.style.cursor='grabbing';
if(ptr.size===2)lastD=dist2();
});
cv.addEventListener('pointermove',function(e){
if(!ptr.has(e.pointerId))return;
var o=ptr.get(e.pointerId),n=ppos(e);ptr.set(e.pointerId,n);
if(ptr.size===1){
var dx=n[0]-o[0],dy=n[1]-o[1];moved+=Math.abs(dx)+Math.abs(dy);
if(moved>8){vx-=dx/S;vy+=dy/S;setFollow(false);}
}else if(ptr.size===2){
var a=Array.from(ptr.values()),d=dist2();moved=99;setFollow(false);
zoomAt((a[0][0]+a[1][0])/2,(a[0][1]+a[1][1])/2,d/lastD);lastD=d;
}
});
function pup(e){
if(ptr.has(e.pointerId)){
var tap=ptr.size===1&&moved<=8&&e.type==='pointerup',p=ppos(e);
ptr.delete(e.pointerId);
if(tap)tgt={x:wxp(p[0]),y:wyp(p[1])};
}
if(!ptr.size)cv.style.cursor='grab';
}
cv.addEventListener('pointerup',pup);cv.addEventListener('pointercancel',pup);
cv.addEventListener('wheel',function(e){e.preventDefault();var p=ppos(e);zoomAt(p[0],p[1],Math.exp(-e.deltaY*0.0015));},{passive:false});

function step(dt,now){
if(!started)return;
var dx=tgt.x-b.x,dy=tgt.y-b.y,dd=Math.hypot(dx,dy);
if(dd>0.06){
var df=Math.atan2(dx,dy)-b.h;df=Math.atan2(Math.sin(df),Math.cos(df));
b.h+=Math.max(-0.9*dt,Math.min(0.9*dt,df))+(Math.sin(now*0.9)+Math.sin(now*2.3))*0.1*dt;
b.x=Math.max(-8,Math.min(8,b.x+Math.sin(b.h)*SPEED*dt));
b.y=Math.max(-3,Math.min(9,b.y+Math.cos(b.h)*SPEED*dt));
}
var d=BY-b.y,ns=d>ZW?0:(d>0?1:2);
if(ns>status){
marks.push({x:b.x,y:b.y,t:ns});
if(ns===2){beep(1000,0.6);pulse=1;nextB=now+0.7;}
}
status=ns;
if(!last||Math.hypot(b.x-last.x,b.y-last.y)>0.05){last={x:b.x,y:b.y};if(dots.length<4000)dots.push({x:b.x,y:b.y,s:status});}
if(status===2&&now>=nextB){nextB=now+0.3;pulse=1;nb++;beep(nb%2?1100:800,0.2);}
pulse=Math.max(0,pulse-dt*(status===2?4:2));
}

function draw(){
cx.setTransform(dpr,0,0,dpr,0,0);
var g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0f3b5f');g.addColorStop(1,'#08213a');
cx.fillStyle=g;cx.fillRect(0,0,W,H);
var steps=[0.05,0.1,0.25,0.5,1,2,5,10,25],gs=25;
for(var si=0;si<steps.length;si++){if(steps[si]*S>=50){gs=steps[si];break;}}
var x0=vx-W/2/S,x1=vx+W/2/S,y0=vy-H/2/S,y1=vy+H/2/S;
cx.strokeStyle='rgba(255,255,255,0.07)';cx.lineWidth=1;cx.beginPath();
for(var gx=Math.floor(x0/gs)*gs;gx<=x1;gx+=gs){cx.moveTo(sx(gx),0);cx.lineTo(sx(gx),H);}
for(var gy=Math.floor(y0/gs)*gs;gy<=y1;gy+=gs){cx.moveTo(0,sy(gy));cx.lineTo(W,sy(gy));}
cx.stroke();
var by=sy(BY),wy=sy(BY-ZW);
cx.fillStyle='rgba(255,60,60,0.16)';cx.fillRect(0,0,W,by);
cx.fillStyle='rgba(255,176,32,0.18)';cx.fillRect(0,by,W,wy-by);
cx.font='600 11px system-ui,sans-serif';cx.fillStyle='rgba(255,255,255,0.7)';cx.textAlign='left';
cx.fillText('OTHER COUNTRY',10,by-8);cx.fillText('WARNING ZONE',10,by+16);cx.fillText('HOME WATERS',10,wy+16);
cx.textAlign='right';cx.fillStyle='#ff8a80';cx.fillText('INTERNATIONAL BORDER',W-10,by-8);
cx.setLineDash([10,6]);cx.strokeStyle='#ff4d3d';cx.lineWidth=2;cx.beginPath();cx.moveTo(0,by);cx.lineTo(W,by);cx.stroke();cx.setLineDash([]);
var bs=Math.max(0.15,10/S);
for(var bi=Math.floor(x0/bs);bi*bs<=x1;bi++){cx.fillStyle=bi%2?'#ffffff':'#ff4d3d';cx.beginPath();cx.arc(sx(bi*bs),by,3,0,7);cx.fill();}
cx.fillStyle='#ffffff';cx.fillRect(sx(0)-4,sy(0)-4,8,8);cx.textAlign='center';cx.fillText('PORT',sx(0),sy(0)+18);
dots.forEach(function(d){cx.fillStyle=COL[d.s];cx.beginPath();cx.arc(sx(d.x),sy(d.y),2.8,0,7);cx.fill();});
marks.forEach(function(m){
var c=m.t===2?COL[2]:COL[1],px=sx(m.x),py=sy(m.y),right=m.x>0.5;
cx.strokeStyle=c;cx.lineWidth=2;cx.beginPath();cx.arc(px,py,9,0,7);cx.stroke();
cx.fillStyle=c;cx.textAlign=right?'right':'left';cx.fillText(m.t===2?'Crossed border':'Entered warning zone',px+(right?-14:14),py+4);
});
cx.setLineDash([3,3]);cx.strokeStyle='rgba(255,255,255,0.75)';cx.lineWidth=1.5;
cx.beginPath();cx.arc(sx(tgt.x),sy(tgt.y),7,0,7);cx.moveTo(sx(tgt.x)-11,sy(tgt.y));cx.lineTo(sx(tgt.x)+11,sy(tgt.y));cx.moveTo(sx(tgt.x),sy(tgt.y)-11);cx.lineTo(sx(tgt.x),sy(tgt.y)+11);cx.stroke();cx.setLineDash([]);
cx.save();cx.translate(sx(b.x),sy(b.y));
cx.globalAlpha=0.25;cx.fillStyle=COL[status];cx.beginPath();cx.arc(0,0,16,0,7);cx.fill();cx.globalAlpha=1;
if(pulse>0){cx.strokeStyle=COL[status];cx.globalAlpha=pulse*0.8;cx.lineWidth=3;cx.beginPath();cx.arc(0,0,14+(1-pulse)*70,0,7);cx.stroke();cx.globalAlpha=1;}
cx.rotate(b.h);cx.fillStyle='#ffffff';cx.strokeStyle=COL[status];cx.lineWidth=2;
cx.beginPath();cx.moveTo(0,-11);cx.lineTo(7,9);cx.lineTo(0,5);cx.lineTo(-7,9);cx.closePath();cx.fill();cx.stroke();
cx.restore();
var bpx=sx(b.x),bpy=sy(b.y);
if(bpx<12||bpx>W-12||bpy<12||bpy>H-12){
var ang=Math.atan2(bpy-H/2,bpx-W/2),ex=Math.max(22,Math.min(W-22,bpx)),ey=Math.max(60,Math.min(H-22,bpy));
cx.save();cx.translate(ex,ey);cx.rotate(ang);cx.fillStyle=COL[status];cx.beginPath();cx.moveTo(14,0);cx.lineTo(-8,-9);cx.lineTo(-8,9);cx.closePath();cx.fill();cx.restore();
cx.fillStyle='#ffffff';cx.textAlign='center';cx.fillText('Boat',ex,ey+(ey>H/2?-14:24));
}
var sl=25;
for(var sk=0;sk<steps.length;sk++){if(steps[sk]*S>=60){sl=steps[sk];break;}}
var sbx=W-10,sby=H-14,sw=sl*S;
cx.strokeStyle='rgba(255,255,255,0.8)';cx.lineWidth=2;cx.beginPath();cx.moveTo(sbx-sw,sby);cx.lineTo(sbx,sby);cx.moveTo(sbx-sw,sby-4);cx.lineTo(sbx-sw,sby+4);cx.moveTo(sbx,sby-4);cx.lineTo(sbx,sby+4);cx.stroke();
cx.fillStyle='rgba(255,255,255,0.8)';cx.textAlign='center';cx.fillText(sl>=1?sl+' km':Math.round(sl*1000)+' m',sbx-sw/2,sby-8);
}

var banner=$('banner'),flash=$('flash'),read=$('read'),lastS=-1;
function loop(ms){
requestAnimationFrame(loop);
var now=ms/1000,dt=Math.min(0.05,prev?now-prev:0.016);prev=now;
step(dt,now);
if(follow){var kf=Math.min(1,dt*5);vx+=(b.x-vx)*kf;vy+=(b.y-vy)*kf;}
draw();
if(status!==lastS){lastS=status;banner.textContent=TXT[status];banner.className=CLS[status];}
flash.style.opacity=status===2?(0.25+0.55*pulse):0;
if(now-lastU>0.15){
lastU=now;var km=BY-b.y;
read.textContent=status===2?'Past the border by '+(-km).toFixed(2)+' km':'Distance to border: '+km.toFixed(2)+' km';
}
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
